name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build fat JAR
        run: mvn --batch-mode package -DskipTests

      - name: Get tag name
        id: tag
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          name: Port Scanner ${{ steps.tag.outputs.TAG }}
          body: |
            ## Port Scanner ${{ steps.tag.outputs.TAG }}

            ### Installation
            Download `port-scanner-*-jar-with-dependencies.jar` and run:
            ```bash
            java -jar port-scanner-*-jar-with-dependencies.jar --host <host> --ports 1-1024
            ```
          files: target/port-scanner-*-jar-with-dependencies.jar
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.TAG, '-') }}
